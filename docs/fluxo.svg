<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b93a7"/>
    </marker>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a2b"/><stop offset="1" stop-color="#0e1220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="430" rx="18" fill="url(#fundo)"/>
  <text x="40" y="52" fill="#e8ebf3" font-size="22" font-weight="600">Como o WIZArd transforma uma conversa de voz em resumo</text>
  <text x="40" y="80" fill="#8b93a7" font-size="14">Cada etapa roda sozinha na VPS; o humano só entra para decidir.</text>

  <!-- etapas -->
  <g font-size="15">
    <rect x="40" y="120" width="190" height="120" rx="12" fill="#1f2740" stroke="#5865f2" stroke-width="2"/>
    <text x="135" y="152" fill="#e8ebf3" font-weight="600" text-anchor="middle">1. Gravação</text>
    <text x="135" y="180" fill="#b7bdcc" font-size="13" text-anchor="middle">canal de voz do Discord</text>
    <text x="135" y="200" fill="#b7bdcc" font-size="13" text-anchor="middle">uma faixa por pessoa</text>
    <text x="135" y="220" fill="#b7bdcc" font-size="13" text-anchor="middle">Opus → Ogg</text>

    <rect x="270" y="120" width="190" height="120" rx="12" fill="#1f2740" stroke="#3fb68b" stroke-width="2"/>
    <text x="365" y="152" fill="#e8ebf3" font-weight="600" text-anchor="middle">2. Transcrição</text>
    <text x="365" y="180" fill="#b7bdcc" font-size="13" text-anchor="middle">Whisper local (CPU)</text>
    <text x="365" y="200" fill="#b7bdcc" font-size="13" text-anchor="middle">nome de quem falou</text>
    <text x="365" y="220" fill="#b7bdcc" font-size="13" text-anchor="middle">+ horário</text>

    <rect x="500" y="120" width="210" height="120" rx="12" fill="#2a2140" stroke="#c084fc" stroke-width="2"/>
    <text x="605" y="152" fill="#e8ebf3" font-weight="600" text-anchor="middle">3. Classificação (LLM)</text>
    <text x="605" y="180" fill="#b7bdcc" font-size="13" text-anchor="middle">"é mesmo uma sessão</text>
    <text x="605" y="200" fill="#b7bdcc" font-size="13" text-anchor="middle">desta mesa?"</text>
    <text x="605" y="220" fill="#b7bdcc" font-size="13" text-anchor="middle">confiança ≥ 0,90 + evidência</text>

    <rect x="750" y="120" width="190" height="120" rx="12" fill="#2a2140" stroke="#c084fc" stroke-width="2"/>
    <text x="845" y="152" fill="#e8ebf3" font-weight="600" text-anchor="middle">4. Resumo (LLM)</text>
    <text x="845" y="180" fill="#b7bdcc" font-size="13" text-anchor="middle">formato da mesa</text>
    <text x="845" y="200" fill="#b7bdcc" font-size="13" text-anchor="middle">glossário corrige</text>
    <text x="845" y="220" fill="#b7bdcc" font-size="13" text-anchor="middle">nomes errados</text>

    <rect x="980" y="120" width="180" height="120" rx="12" fill="#3a2a18" stroke="#f5a524" stroke-width="2"/>
    <text x="1070" y="152" fill="#e8ebf3" font-weight="600" text-anchor="middle">5. Aprovação</text>
    <text x="1070" y="180" fill="#b7bdcc" font-size="13" text-anchor="middle">DM para o dono</text>
    <text x="1070" y="200" fill="#b7bdcc" font-size="13" text-anchor="middle">com botões; entra na</text>
    <text x="1070" y="220" fill="#b7bdcc" font-size="13" text-anchor="middle">coleção só se aprovar</text>
  </g>

  <!-- setas principais -->
  <g stroke="#8b93a7" stroke-width="2" fill="none" marker-end="url(#seta)">
    <line x1="232" y1="180" x2="266" y2="180"/>
    <line x1="462" y1="180" x2="496" y2="180"/>
    <line x1="712" y1="180" x2="746" y2="180"/>
    <line x1="942" y1="180" x2="976" y2="180"/>
  </g>
  <text x="729" y="170" fill="#3fb68b" font-size="12" text-anchor="middle">sim</text>

  <!-- ramo de dúvida -->
  <g stroke="#8b93a7" stroke-width="2" fill="none">
    <path d="M605,242 L605,300" marker-end="url(#seta)"/>
    <path d="M760,330 L845,330 L845,244" marker-end="url(#seta)"/>
  </g>
  <rect x="470" y="302" width="290" height="58" rx="12" fill="#3a2a18" stroke="#f5a524" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="615" y="327" fill="#e8ebf3" font-size="14" font-weight="600" text-anchor="middle">Não reconheceu? Pergunta ao dono</text>
  <text x="615" y="347" fill="#b7bdcc" font-size="13" text-anchor="middle">"Sim" libera o resumo · "Não" bloqueia</text>
  <text x="625" y="285" fill="#f5a524" font-size="12">dúvida</text>
  <text x="803" y="322" fill="#3fb68b" font-size="12" text-anchor="middle">sim</text>

  <!-- rodapé -->
  <text x="40" y="400" fill="#8b93a7" font-size="13">Glossário automático: nomes extraídos das sessões aprovadas viram hotwords do Whisper (2) e referência do resumidor (4).</text>
</svg>
